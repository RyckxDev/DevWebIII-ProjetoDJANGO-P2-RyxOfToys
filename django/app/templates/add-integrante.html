{% extends "template.html" %}

{% block titulo %}Home{%endblock%}

{%block conteudo%}
<h2> Novo Integrante</h2>
<form method="POST" action="{% url 'addIntegrante'%}">
    {% csrf_token %}

    <label for="nome">Nome:</label>
    <input type="text" name="nome" id="nome" required><br>

    <label for="cargo">Descrição do cargo:</label>
    <input type="text" name="cargo" id="cargo" required><br>

    <label for="biografia">Biografia:</label>
    <textarea name="biografia" id="biografia" required></textarea><br>

    <label for="foto">Foto (URL):</label>
    <input type="url" name="foto" id="foto"> <br>

    <button type="submit">Cadastrar</button >
</form>
{% endblock %}
