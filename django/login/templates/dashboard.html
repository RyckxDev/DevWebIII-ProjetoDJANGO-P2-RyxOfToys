{% extends 'template.html' %}

{% block titulo %} Dashboard {% endblock %}

{% block conteudo %}
    <h2>Dashboard</h2>

    <p>Olá, <strong>{{ user.username }}</strong>!</p>

    <p><a href="{% url 'perfil' %}">Meu Perfil</a></p>

    <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <input type="submit" value="Sair">
    </form>

{% endblock %}
